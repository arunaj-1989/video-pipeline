services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SBE_POSTGRES_DB:-uvm_local}
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: ${SBE_POSTGRES_USER:-uvm_local}
    ports:
      - "127.0.0.1:${SBE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
